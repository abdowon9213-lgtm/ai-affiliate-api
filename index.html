<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد الإعلانات الذكي</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            width: 100%;
            background-color: #27ae60;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #219653;
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background: #e8f8f5;
            border: 1px solid #a3e4d7;
            border-radius: 5px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>مولد الإعلانات التسويقية الذكي</h2>
    
    <form id="adForm">
        <label for="product_name">اسم المنتج أو الخدمة:</label>
        <input type="text" id="product_name" name="product_name" required placeholder="مثال: زيت الأرجان من أرفيا">

        <label for="features">مميزات المنتج الأساسية:</label>
        <textarea id="features" name="features" rows="3" required placeholder="مثال: طبيعي 100%، غني بفيتامين E، يرطب البشرة..."></textarea>

        <label for="target_audience">الجمهور المستهدف:</label>
        <input type="text" id="target_audience" name="target_audience" required placeholder="مثال: النساء المهتمات بالعناية الشخصية">

        <label for="language">لغة / لهجة الإعلان:</label>
        <select id="language" name="language">
            <option value="ar_ly">اللهجة الليبية</option>
            <option value="ar_sa">اللهجة السعودية</option>
            <option value="ar_msa">العربية الفصحى</option>
            <option value="en">English</option>
        </select>

        <button type="submit" id="submitBtn">توليد الإعلان</button>
    </form>

    <div id="resultContainer" style="display:none;">
        <h3 style="margin-top: 20px; color: #2c3e50;">الإعلان الناتج:</h3>
        <div class="result-box" id="adResult"></div>
    </div>
</div>

<script>
    document.getElementById('adForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        const resultContainer = document.getElementById('resultContainer');
        const adResult = document.getElementById('adResult');

        submitBtn.disabled = true;
        submitBtn.textContent = 'جاري التوليد...';
        resultContainer.style.display = 'none';

        const payload = {
            product_name: document.getElementById('product_name').value,
            features: document.getElementById('features').value,
            target_audience: document.getElementById('target_audience').value,
            language: document.getElementById('language').value
        };

        try {
            const response = await fetch('/api/v1/generate-ads', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok && data.success) {
                adResult.textContent = data.ad;
                resultContainer.style.display = 'block';
            } else {
                alert(data.detail || 'حدث خطأ أثناء توليد الإعلان.');
            }
        } catch (error) {
            alert('تعذر الاتصال بالخادم. تحقق من اتصال الإنترنت.');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'توليد الإعلان';
        }
    });
</script>

</body>
    </html>
