<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المسوق الذكي - السعودية</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f7f4;
  margin: 0;
  padding: 18px;
  color: #222;
}
main {
  max-width: 700px;
  margin: auto;
}
header {
  background: #14532d;
  color: white;
  padding: 22px;
  border-radius: 14px;
  text-align: center;
}
.panel {
  background: white;
  padding: 18px;
  margin-top: 18px;
  border-radius: 14px;
}
label {
  display: block;
  font-weight: bold;
  margin-top: 14px;
}
input, textarea {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}
textarea { min-height: 100px; }
button {
  background: #166534;
  color: white;
  border: 0;
  padding: 13px;
  border-radius: 9px;
  margin-top: 15px;
  width: 100%;
  font-size: 16px;
  cursor: pointer;
}
.result {
  background: #f8faf8;
  padding: 14px;
  margin-top: 15px;
  border-radius: 10px;
  border: 1px solid #ddd;
}
.copy {
  background: #e8f0e9;
}
.status { margin-top: 12px; }
</style>
</head>

<body>
<main>
<header>
<h2>المسوق الذكي 2.0</h2>
<p>إنشاء إعلانات تسويقية باللهجة السعودية</p>
</header>

<section class="panel">
<h3>بيانات المنتج</h3>

<label>اسم المنتج</label>
<input id="product" placeholder="اكتب اسم المنتج">

<label>مميزات المنتج</label>
<textarea id="features" placeholder="اكتب مميزات المنتج"></textarea>

<label>الجمهور المستهدف</label>
<input id="audience" value="المتسوقون في السعودية">

<label>رابط المنتج</label>
<input id="productUrl" placeholder="رابط صفحة المنتج">

<label>رابط العمولة</label>
<input id="affiliateUrl" placeholder="الصق رابط العمولة">

<label>ملاحظات إضافية</label>
<input id="notes" placeholder="ملاحظات اختيارية">

<button id="generate" onclick="generate()">إنشاء 3 إعلانات سعودية</button>
<p id="status" class="status"></p>
</section>

<section class="panel" id="results" hidden>
<h3>الإعلانات المقترحة</h3>
<p id="disclosure"></p>
<div id="variants"></div>
</section>
</main>

<script>
async function generate() {
  const product_name = document.getElementById("product").value.trim();
  const features = document.getElementById("features").value.trim();
  const target_audience = document.getElementById("audience").value.trim();
  const product_url = document.getElementById("productUrl").value.trim() || null;
  const affiliate_url = document.getElementById("affiliateUrl").value.trim();
  const extra_notes = document.getElementById("notes").value.trim() || null;
  const status = document.getElementById("status");
  const button = document.getElementById("generate");

  if (!product_name || !features || !affiliate_url) {
    status.textContent = "أدخل اسم المنتج ومميزاته ورابط العمولة.";
    return;
  }

  try {
    new URL(affiliate_url);
    if (product_url) new URL(product_url);
  } catch {
    status.textContent = "تأكد من صحة الروابط.";
    return;
  }

  button.disabled = true;
  status.textContent = "جارٍ إنشاء الإعلانات...";

  try {
    const response = await fetch("/api/v1/generate-ads", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        product_name,
        features,
        target_audience,
        product_url,
        affiliate_url,
        extra_notes
      })
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || "حدث خطأ.");

    document.getElementById("disclosure").textContent = data.disclosure;
    const container = document.getElementById("variants");
    container.innerHTML = "";

    data.variants.forEach((item, index) => {
      const article = document.createElement("div");
      article.className = "result";

      const title = document.createElement("h3");
      title.textContent = (index + 1) + ". " + item.title;

      const copy = document.createElement("p");
      copy.textContent = item.copy;

      const tags = document.createElement("p");
      tags.textContent = (item.hashtags || []).join(" ");

      const link = document.createElement("p");
      link.textContent = "رابط العمولة: " + data.affiliate_url;

      const button = document.createElement("button");
      button.className = "copy";
      button.textContent = "نسخ الإعلان مع الرابط والإفصاح";
      button.onclick = async () => {
        const fullText =
          item.title + "\n\n" +
          item.copy + "\n\n" +
          tags.textContent + "\n\n" +
          data.disclosure + "\n\n" +
          "رابط الشراء: " + data.affiliate_url;

        try {
          await navigator.clipboard.writeText(fullText);
          button.textContent = "تم النسخ";
        } catch {
          alert("تعذر النسخ تلقائياً. انسخ النص يدوياً.");
        }
      };

      article.append(title, copy, tags, link, button);
      container.appendChild(article);
    });

    document.getElementById("results").hidden = false;
    status.textContent = "تم إنشاء الإعلانات. راجعها قبل النشر.";
  } catch (error) {
    status.textContent = error.message;
  } finally {
    button.disabled = false;
  }
}
</script>
</body>
    </html>
